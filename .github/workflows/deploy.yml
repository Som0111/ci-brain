name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-brain:ci .

  # Deploy itself is handled by Render's native GitHub integration (auto-deploy
  # on push to master, using the same Dockerfile validated by the build job
  # above), not a custom deploy step here - Render doesn't need a
  # GitHub-Actions-triggered push/token for this project's setup. See
  # HUMAN_GUIDE.md for the one-time manual dashboard steps.
